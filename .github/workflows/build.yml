name: Build HJD Camera Pro (Signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          echo "=== after ==="
          df -h /

      - name: Fetch embedded AI models
        run: |
          chmod +x ci/fetch_models.sh
          ./ci/fetch_models.sh
          echo "=== Model bundle size ==="
          du -sh HJDCamera/Resources/Models/ 2>/dev/null || echo "No models dir"
          ls -la HJDCamera/Resources/Models/ 2>/dev/null || true

      - name: Decode and install certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -e

          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "hjd123" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "hjd123" "$KEYCHAIN_PATH"

          # Import p12
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "hjd123" "$KEYCHAIN_PATH"

          # Install provisioning profile
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Verify
          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== Provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project HJDCamera.xcodeproj \
            -target HJDCamera \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build_out" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=VVAG93HGLX \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -100

      - name: Locate app
        id: locate
        run: |
          APP_PATH=$(find build_out -maxdepth 1 -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          test -n "$APP_PATH"
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"
          echo "=== App contents ==="
          ls -la "$APP_PATH/"
          echo "=== Models in app ==="
          ls -la "$APP_PATH/Models/" 2>/dev/null || echo "No Models dir"

      - name: Verify code signature
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true
          echo "=== Embedded profile ==="
          security cms -D -i "$APP_PATH/embedded.mobileprovision" 2>/dev/null | head -30 || true

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q HJD_Camera_Pro.ipa Payload
          ls -lh HJD_Camera_Pro.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HJD_Camera_Pro_Signed
          path: HJD_Camera_Pro.ipa
          retention-days: 30
          compression-level: 0
