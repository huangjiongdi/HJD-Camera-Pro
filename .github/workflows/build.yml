name: Build HJD Camera Pro (Signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          echo "=== after ==="
          df -h /

      - name: Fetch embedded AI models
        run: |
          chmod +x ci/fetch_models.sh
          ./ci/fetch_models.sh
          echo "=== Model bundle size ==="
          du -sh HJDCamera/Resources/Models/ 2>/dev/null || echo "No models dir"
          ls -la HJDCamera/Resources/Models/ 2>/dev/null || true

      - name: Decode and install certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -e

          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "hjd123" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "hjd123" "$KEYCHAIN_PATH"

          # Write decode script
          cat > "$RUNNER_TEMP/decode.py" << 'PYEOF'
          import base64, sys
          data = base64.b64decode(sys.argv[1])
          with open(sys.argv[2], 'wb') as f:
              f.write(data)
          print(f"Decoded {sys.argv[2]}: {len(data)} bytes, magic: {data[:4].hex()}")
          PYEOF

          # Decode p12
          python3 "$RUNNER_TEMP/decode.py" "$P12_BASE64" "$RUNNER_TEMP/cert_raw.p12"
          ls -la "$RUNNER_TEMP/cert_raw.p12"

          # Re-encrypt p12 with openssl legacy format (macOS security import compatible)
          openssl pkcs12 -in "$RUNNER_TEMP/cert_raw.p12" -out "$RUNNER_TEMP/cert.pem" -nodes -passin pass:"$P12_PASSWORD" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/cert.pem" ] && [ -s "$RUNNER_TEMP/cert.pem" ]; then
            openssl pkcs12 -in "$RUNNER_TEMP/cert.pem" -export -out "$RUNNER_TEMP/cert.p12" -passout pass:hjd2024
            IMPORT_PASS="hjd2024"
            echo "Converted p12 with openssl"
          else
            cp "$RUNNER_TEMP/cert_raw.p12" "$RUNNER_TEMP/cert.p12"
            IMPORT_PASS="$P12_PASSWORD"
            echo "Using original p12"
          fi
          ls -la "$RUNNER_TEMP/cert.p12"

          # Import p12 into keychain
          security import "$RUNNER_TEMP/cert.p12" -P "$IMPORT_PASS" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "hjd123" "$KEYCHAIN_PATH"

          # Decode provisioning profile
          python3 "$RUNNER_TEMP/decode.py" "$MOBILEPROVISION_BASE64" "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/c2619af0-8701-4afa-b741-f09f8c8820fb.mobileprovision

          # Verify
          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== Provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (signed)
        run: |
          # The default Actions shell is `bash -eo pipefail`, so a failing
          # xcodebuild makes the pipeline fail; the `||` block just prints the
          # error summary before exiting non-zero.
          xcodebuild \
            -project HJDCamera.xcodeproj \
            -target HJDCamera \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build_out" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution: Fangcheng Li (VVAG93HGLX)" \
            PROVISIONING_PROFILE=c2619af0-8701-4afa-b741-f09f8c8820fb \
            DEVELOPMENT_TEAM=VVAG93HGLX \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log || {
              echo "=== BUILD FAILED ==="
              echo "=== ERRORS (unique) ==="
              grep -i "error:" build.log | sort -u | head -120 || true
              echo "=== END ERRORS ==="
              exit 1
            }
          echo "=== BUILD SUCCEEDED ==="

      - name: Locate app
        id: locate
        run: |
          APP_PATH=$(find build_out -maxdepth 1 -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          test -n "$APP_PATH"
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"
          echo "=== Compiled models in app (root) ==="
          MODEL_COUNT=$(find "$APP_PATH" -maxdepth 1 -name "*.mlmodelc" | wc -l | tr -d ' ')
          echo "Compiled model count: $MODEL_COUNT"
          ls -1 "$APP_PATH"/*.mlmodelc 2>/dev/null | xargs -I{} basename {} || true

      - name: Verify code signature
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true
          echo "=== Embedded profile ==="
          security cms -D -i "$APP_PATH/embedded.mobileprovision" 2>/dev/null | head -30 || true

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q HJD_Camera_Pro.ipa Payload
          ls -lh HJD_Camera_Pro.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HJD_Camera_Pro_Signed
          path: HJD_Camera_Pro.ipa
          retention-days: 30
          compression-level: 0
